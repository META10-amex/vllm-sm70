name: Build vLLM sm70 Image

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      vllm_version:
        description: 'vLLM version to build (e.g. 0.14.1)'
        required: false
        default: ''

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check for new vLLM release
        id: check
        run: |
          set -e

          if [ -n "${{ github.event.inputs.vllm_version }}" ]; then
            VERSION="${{ github.event.inputs.vllm_version }}"
          else
            VERSION=$(curl -s https://api.github.com/repos/vllm-project/vllm/releases/latest | jq -r .tag_name)
            VERSION="${VERSION#v}"
          fi

          echo "Latest vLLM version: $VERSION"

          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/jajmangold/vllm-sm70/manifests/${VERSION}")

          if [ "$EXISTS" = "200" ] && [ -z "${{ github.event.inputs.vllm_version }}" ]; then
            echo "Image already exists, skipping"
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "Building vLLM $VERSION"
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          docker system prune -af --volumes || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/jajmangold/vllm-sm70:${{ needs.check-release.outputs.version }}
            ghcr.io/jajmangold/vllm-sm70:latest
          build-args: |
            VLLM_VERSION=${{ needs.check-release.outputs.version }}
            PYTORCH_IMAGE=pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
            BUILDKIT_INLINE_CACHE=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
